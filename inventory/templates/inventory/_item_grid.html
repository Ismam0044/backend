{% if tiles %}
    {% for tile in tiles %}
        <div class="item-tile" hx-post="{% url 'inventory:add_to_cart' %}"
             hx-vals='{"item_id": "{{ tile.item.id }}"}'
             hx-target="#cart-items"
             hx-swap="innerHTML">
            <div class="item-name">{{ tile.item.name }}</div>
            <div class="item-meta">{{ tile.item.code|default:"" }} &middot; {{ tile.item.unit.short_name }}</div>
            <div class="item-meta">Available: {{ tile.stock }}</div>
        </div>
    {% endfor %}
{% else %}
    <div class="text-muted small p-3">No items found.</div>
{% endif %}
