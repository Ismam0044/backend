{% extends "base.html" %}
{% load static %}
{% block title %}Login - A2i ERP{% endblock %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: var(--bg);">
    <div class="card-surface p-4" style="width: 380px;">
        <div class="text-center mb-4">
            <span class="badge-dot d-inline-flex align-items-center justify-content-center" style="width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;font-size:1.3rem;">
                <i class="bi bi-shop"></i>
            </span>
            <h1 class="h5 mt-3 mb-0">A2i ERP</h1>
            <p class="text-muted small">Sign in to continue</p>
        </div>
        {% if form.errors %}
            <div class="alert alert-danger py-2 small">Invalid username or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id-username">Username</label>
                <input type="text" id="id-username" name="username" class="form-control" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="id-password">Password</label>
                <input type="password" id="id-password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
