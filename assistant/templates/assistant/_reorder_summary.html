{% if summary %}
<div class="card-surface p-3 mb-3" style="border-left: 3px solid var(--primary);">
    <div class="d-flex align-items-start gap-2">
        <i class="bi bi-stars text-primary mt-1"></i>
        <div style="white-space: pre-wrap;">{{ summary }}</div>
    </div>
</div>
{% elif error %}
<div class="alert alert-danger py-2 small mb-3">AI summary failed: {{ error }}</div>
{% endif %}
