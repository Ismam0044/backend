{% if query %}
<div class="mb-3">
    <div class="d-flex justify-content-end mb-1">
        <div class="badge-soft-primary rounded-3 px-3 py-2" style="max-width: 80%;">{{ query.question }}</div>
    </div>
    <div class="d-flex justify-content-start">
        <div class="rounded-3 px-3 py-2" style="max-width: 80%; background: var(--bg); border:1px solid var(--border); white-space: pre-wrap;">
            {% if query.error %}
                <span class="text-danger small">AI error: {{ query.error }}</span>
            {% else %}{{ query.answer }}{% endif %}
        </div>
    </div>
</div>
{% endif %}
