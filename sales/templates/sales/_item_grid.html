{% if tiles %}
    {% for tile in tiles %}
        <div class="item-tile" hx-post="{% url 'sales:add_to_cart' %}"
             hx-vals='{"item_id": "{{ tile.item.id }}"}'
             hx-target="#cart-items"
             hx-swap="innerHTML">
            <div class="item-name">{{ tile.item.name }}</div>
            <div class="item-meta">{{ tile.item.code|default:"" }} &middot; {{ tile.item.unit.short_name }}</div>
            <div class="item-meta {% if tile.stock <= tile.item.reorder_level %}item-stock-low{% endif %}">
                Stock: {{ tile.stock }}
            </div>
            <div class="item-price">৳{{ tile.item.sale_price }}</div>
        </div>
    {% endfor %}
{% else %}
    <div class="text-muted small p-3">No items found. Try a different search, or add items from the admin panel.</div>
{% endif %}
