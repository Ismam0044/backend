{% if cart_lines %}
    {% for line in cart_lines %}
        <div class="cart-line">
            <div class="flex-grow-1">
                <div class="line-name">{{ line.name }}</div>
                <div class="line-meta">৳{{ line.unit_price }} &times; {{ line.quantity }} {{ line.unit }} = ৳{{ line.line_total }}</div>
            </div>
            <input type="number" step="0.01" min="0" class="qty-input" value="{{ line.quantity }}"
                   aria-label="Quantity for {{ line.name }}"
                   hx-post="{% url 'sales:update_cart_line' %}"
                   hx-vals='{"item_id": "{{ line.item_id }}"}'
                   hx-trigger="change"
                   hx-target="#cart-items"
                   name="quantity">
            <button class="btn btn-sm btn-link text-danger p-0 ms-2"
                    aria-label="Remove {{ line.name }} from cart"
                    hx-post="{% url 'sales:remove_cart_line' %}"
                    hx-vals='{"item_id": "{{ line.item_id }}"}'
                    hx-target="#cart-items">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    {% endfor %}
{% else %}
    <div class="cart-empty">
        <i class="bi bi-cart-x fs-2"></i>
        <p class="mb-0 small">Cart is empty. Click an item to add it.</p>
    </div>
{% endif %}
